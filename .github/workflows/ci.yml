name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'evidence/**']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_URL: https://app.yohan-stock.duckdns.org

jobs:
  test:
    name: Тесты
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка зависимостей
        run: pip install -r requirements-dev.txt

      - name: Запуск тестов
        run: python -m pytest tests/ -v

  build:
    name: Сборка и публикация
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.ver.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Чтение версии
        id: ver
        run: echo "value=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация образа
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.value }}

      - name: Сводка выпуска
        run: |
          echo "version: ${{ steps.ver.outputs.value }}" >> "$GITHUB_STEP_SUMMARY"
          echo "commit:  ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest:  ${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Доставка на VPS
    needs: build
    runs-on: ubuntu-24.04
    # Общая группа с rollback.yml: доставка и откат никогда не идут одновременно
    concurrency:
      group: task02-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Копирование файлов доставки
        run: |
          scp compose.yaml scripts/deploy.sh \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/task-02/app/"

      - name: Развёртывание по digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash /opt/task-02/app/deploy.sh '${IMAGE}' '${VERSION}'"

      - name: Проверка через HTTPS
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${APP_URL}/health"
          echo
          GOT="$(curl -fsS "${APP_URL}/version" | jq -r .version)"
          echo "version: ${GOT}"
          test "${GOT}" = "${VERSION}" || { echo "Ожидалась версия ${VERSION}"; exit 1; }
          SUM="$(curl -fsS "${APP_URL}/add?a=2&b=3" | jq .result)"
          echo "2 + 3 = ${SUM}"
          test "${SUM}" = "5"

      - name: Сводка доставки
        run: |
          echo "deployed version: ${{ needs.build.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "deployed digest:  ${{ needs.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
